[build-system]
requires = [
    "setuptools>=77.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "hs-dbus-signature"
description = "D-Bus signature hypothesis strategy generator"
authors = [
    { name = "Anne Mulhern", email = "amulhern@redhat.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Hypothesis",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "hypothesis",
]
dynamic = [
    "version",
]
license = "MPL-2.0"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/mulkieran/hs-dbus-signature"

[tool.setuptools]
packages = [
    "hs_dbus_signature",
]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic.version]
attr = "hs_dbus_signature._version.__version__"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "F", "PL"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
